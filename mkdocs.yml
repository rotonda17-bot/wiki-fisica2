site_name: Wiki de Física II
site_description: Apuntes, fórmulas y gráficos interactivos de la materia

theme:
  name: material
  language: es
  palette:
    scheme: slate
    primary: indigo
    accent: blue
  features:
    - navigation.indexes
    - navigation.expand
    - search.suggest
    - search.highlight

plugins:
  - search
  - roamlinks

markdown_extensions:
  - search
  - roamlinks
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Inicio: index.md
  - Unidad I:
      - 1.1 Leyes de Kepler: Unidad I/1.1-Gravitacion-Universal-y-Leyes-de-Kepler.md
      - 1.2 Campo y Potencial: Unidad I/1.2-Campo-y-Potencial-Gravitatorio.md
      - 1.3 Satélites y Órbitas: Unidad I/1.3-Satelites-Movimiento-Orbital-y-Energia.md
  - Unidad II:
      - 2.1 Elasticidad y Ley de Hooke: Unidad II/2.1-Elasticidad-Modulos-y-Ley-de-Hooke.md
      - 2.2 Energía Potencial Elástica: Unidad II/2.2-Energia-Potencial-Elastica-y-Trabajo.md
  - Unidad III:
      - 3.1 Ecuaciones del MAS: Unidad III/3.1-Movimiento-Armonico-Simple-MAS-Ecuaciones.md