site_name: Wiki Física II
site_url: https://rotonda17-bot.github.io/wiki-fisica2/
site_description: Apuntes, fórmulas y gráficos interactivos de la materia

theme:
  name: material
  language: es
  palette:
    scheme: slate
    primary: indigo
    accent: blue
  features:
    - navigation.indexes
    - navigation.expand
    - search.suggest
    - search.highlight

plugins:
  - search
  - roamlinks

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Inicio: index.md
  - Unidad I:
      - 1.1 Leyes de Kepler: Unidad I/1.1-Gravitacion-Universal-y-Leyes-de-Kepler.md
      - 1.2 Campo y Potencial: Unidad I/1.2-Campo-y-Potencial-Gravitatorio.md
      - 1.3 Satélites y Órbitas: Unidad I/1.3-Satelites-Movimiento-Orbital-y-Energia.md
  - Unidad II:
      - 2.1 Elasticidad y Ley de Hooke: Unidad II/2.1-Elasticidad-Modulos-y-Ley-de-Hooke.md
      - 2.2 Energía Potencial Elástica: Unidad II/2.2-Energia-Potencial-Elastica-y-Trabajo.md
  - Unidad III:
      - 3.1 Ecuaciones del MAS: Unidad III/3.1-Movimiento-Armonico-Simple-MAS-Ecuaciones.md
      - 3.2 Energía en el MAS: Unidad III/3.2-Energia-en-el-MAS-y-Sistemas-Oscilantes.md
      - 3.3 Sistemas Oscilantes Reales: Unidad III/3.3-Sistemas-Oscilantes-Reales-y-Avanzados.md
      - 3.4 Amortiguamiento y Resonancia: Unidad III/3.4-Oscilaciones-Amortiguamiento-Forzadas-Resonancia-y-Superposición.md
  - Unidad IV:
      - 4.1 Ondas Mecánicas: Unidad IV/4.1-Ondas-Mecanicas-Transversales-y-Longitudinales.md
      - 4.2 Ecuación de Onda e Interferencia: Unidad IV/4.2-Ecuacion-de-Onda-Energia-e-Interferencia.md
  - Unidad V:
      - 5.1 Hidrostática: Unidad V/5.1-Hidrostatica-Teoria-y-Ejercicios.md
      - 5.2 Hidrodinámica: Unidad V/5.2-Hidrodinamica-Teoria-y-Ejercicios.md
  - Unidad VI:
      - 6.1 Termometría, Dilatación y Gas Ideal: Unidad VI/6.1-Termometria-Dilatacion-y-Gas-Ideal.md
      - 6.2 Calorimetría, Primera Ley y Transferencia: Unidad VI/6.2-Calorimetria-Primera-Ley-y-Transferencia.md